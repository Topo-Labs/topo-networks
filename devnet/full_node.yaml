base:
  data_dir: "/opt/aptos/data"
  role: "full_node"
  waypoint:
    from_file: "/opt/aptos/waypoint.txt"

execution:
  genesis_file_location: "/opt/aptos/genesis.blob"

full_node_networks:
  - network_id: "public"
    discovery_method: "onchain"
    listen_address: "/ip4/0.0.0.0/tcp/6180"
    seeds: {}

api:
  enabled: true
  address: "0.0.0.0:8080"

indexer_table_info:
  table_info_service_mode: "IndexingOnly"
  parser_task_count: 20
  parser_batch_size: 1000

indexer_grpc:
  enabled: true
  use_data_service_interface: true
  address: "0.0.0.0:30041"
  processor_task_count: 10
  processor_batch_size: 100
  output_batch_size: 100
